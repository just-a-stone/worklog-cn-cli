name: Bug 报告
description: 命令报错、输出不对或提交结果与预期不符
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **提交前请脱敏**：去掉服务地址、账号、密码、Cookie/JSESSIONID、requestid 和工作内容正文。

  - type: input
    id: version
    attributes:
      label: 版本
      description: "`worklog-cn-cli --version` 的输出"
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 执行的命令
      description: 脱敏后的完整命令
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 脱敏后的错误输出和退出码
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认项
      options:
        - label: 我已确认粘贴的内容中不含账号、密码、Cookie 或真实服务地址
          required: true
        - label: 我已用 `login --write-env` 刷新过会话，问题仍然存在
          required: false
